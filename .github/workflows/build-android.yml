name: Build Android
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: media-blocks
            solution: "Media Blocks SDK/VisioForge.MediaBlocks.Demos.CS Android.sln"
          - sdk: media-player
            solution: "Media Player SDK X/VisioForge.MediaPlayer.X.Demos.CS.Android.sln"
          - sdk: video-capture
            solution: "Video Capture SDK X/VisioForge.VideoCaptureX.Demos.CS Android.sln"
    name: build (${{ matrix.sdk }})
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      if: runner.environment == 'github-hosted'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          9.0.x
          10.0.x

    - name: Install workloads
      if: runner.environment == 'github-hosted'
      run: dotnet workload install android

    - name: Restore dependencies
      run: dotnet restore "${{ matrix.solution }}" --disable-parallel

    - name: Build app for release
      run: dotnet build "${{ matrix.solution }}" --configuration Release --no-restore --disable-parallel /p:BuildInParallel=false
