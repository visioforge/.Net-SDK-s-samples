name: Build iOS and macOS
on:
  workflow_dispatch:

# The self-hosted Mac runs a newer Xcode than its .NET Apple workload names; the SDK repo builds the same way.
env:
  ValidateXcodeVersion: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: vf-mac

    env:
      Solution_Name_MB: "Media Blocks SDK/VisioForge.MediaBlocks.Demos.CS iOS.sln"
      Solution_Name_VC: "Video Capture SDK X/VisioForge.VideoCaptureX.Demos.CS iOS.sln"

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.4
        if: runner.environment == 'github-hosted'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4"

      - name: Setup .NET (ARM64)
        if: runner.environment == 'github-hosted'
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --channel 9.0 --architecture arm64
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --version 10.0.203 --architecture arm64
          echo "$HOME/.dotnet" >> $GITHUB_PATH
          echo "DOTNET_ROOT=$HOME/.dotnet" >> $GITHUB_ENV

      # Pin to the .NET 10 workload set targeting Xcode 26.4 (stable on macos-26).
      # The latest workload set requires Xcode 26.5 (beta), which is not reliably selectable.
      - name: Install workloads
        if: runner.environment == 'github-hosted'
        run: dotnet workload install ios macos --version 10.0.203.1

      # Media Blocks
      - name: Build (Media Blocks)
        run: dotnet build "${{ env.Solution_Name_MB }}" --configuration Release /p:_RequireCodeSigning=false /p:CodesignKey="-"

      # Video Capture
      - name: Build (Video Capture)
        run: dotnet build "${{ env.Solution_Name_VC }}" --configuration Release /p:_RequireCodeSigning=false /p:CodesignKey="-"

      # Media Player X (iOS)
      - name: Build (Media Player X iOS)
        run: dotnet build "Media Player SDK X/VisioForge.MediaPlayer.X.Demos.CS.iOS.sln" --configuration Release /p:_RequireCodeSigning=false /p:CodesignKey="-"

      # macOS
      - name: Build (Media Blocks macOS)
        run: dotnet build "Media Blocks SDK/VisioForge.MediaBlocks.Demos.CS macOS.sln" --configuration Release /p:_RequireCodeSigning=false /p:CodesignKey="-"

      - name: Build (Media Player X macOS)
        run: dotnet build "Media Player SDK X/VisioForge.MediaPlayer.X.Demos.CS.MacOS.sln" --configuration Release /p:_RequireCodeSigning=false /p:CodesignKey="-"

      - name: Build (Video Capture X macOS)
        run: dotnet build "Video Capture SDK X/VisioForge.VideoCaptureX.Demos.CS macOS.sln" --configuration Release /p:_RequireCodeSigning=false /p:CodesignKey="-"
