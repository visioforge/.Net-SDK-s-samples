name: Build MAUI (All SDKs)
on:
  workflow_dispatch:

# The self-hosted Mac runs a newer Xcode than its .NET Apple workload names; the SDK repo builds the same way.
env:
  ValidateXcodeVersion: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          # One runner per SDK: all four on one hosted runner ran out of disk
          # part-way through the first SDK's Android build (#4125).
          - os: xcode-27
            sdk: media-blocks
          - os: xcode-27
            sdk: media-player
          - os: xcode-27
            sdk: video-capture
          - os: xcode-27
            sdk: video-edit
    name: build (${{ matrix.os }}${{ matrix.sdk && format(' / {0}', matrix.sdk) || '' }})
    runs-on: ${{ matrix.os }}

    env:
      Solution_Name_MB: "Media Blocks SDK/VisioForge.MediaBlocks.Demos.CS MAUI.sln"
      Solution_Name_MP: "Media Player SDK X/VisioForge.MediaPlayer.X.Demos.CS.MAUI.sln"
      Solution_Name_VC: "Video Capture SDK X/VisioForge.VideoCaptureX.Demos.CS MAUI.sln"
      # iOS builds skip the NDI Player samples: NDI is not available on iOS.
      Solution_Filter_MB_iOS: "Media Blocks SDK/VisioForge.MediaBlocks.Demos.CS MAUI.iOS.slnf"
      Solution_Filter_VC_iOS: "Video Capture SDK X/VisioForge.VideoCaptureX.Demos.CS MAUI.iOS.slnf"

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode (image default)
      if: runner.environment == 'github-hosted' && runner.os == 'macOS'
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Setup .NET
      if: runner.environment == 'github-hosted' && runner.os != 'macOS'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup .NET (macOS ARM64)
      if: runner.environment == 'github-hosted' && runner.os == 'macOS'
      run: |
        curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --version 10.0.203 --architecture arm64
        echo "$HOME/.dotnet" >> $GITHUB_PATH
        echo "DOTNET_ROOT=$HOME/.dotnet" >> $GITHUB_ENV

    - name: Install MAUI workloads (Windows)
      if: runner.environment == 'github-hosted' && runner.os == 'Windows'
      run: dotnet workload install maui maui-android maui-windows maui-desktop maui-mobile android

    # Pinned .NET 10 workload set. ValidateXcodeVersion is off (repo root env), so it builds under
# the xcode-27 image's newer Xcode instead of refusing the mismatch.
    - name: Install MAUI workloads (macOS)
      if: runner.environment == 'github-hosted' && runner.os == 'macOS'
      run: dotnet workload install maui maui-android maui-ios maui-maccatalyst maui-desktop maui-mobile android ios maccatalyst --version 10.0.203.1

    - name: Setup Java JDK
      if: runner.environment == 'github-hosted'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Free space and memory (macOS)
      if: runner.os == 'macOS'
      run: |
        df -h /
        vm_stat | head -5

    # Media Blocks SDK
    - name: Restore (Media Blocks)
      if: runner.os == 'Windows' || matrix.sdk == 'media-blocks'
      run: dotnet restore "${{ env.Solution_Name_MB }}"

    - name: Build Media Blocks (Windows)
      if: runner.os == 'Windows'
      run: dotnet build "${{ env.Solution_Name_MB }}" --configuration Release --no-restore -f net10.0-windows10.0.19041.0

    - name: Build Media Blocks (macCatalyst)
      if: matrix.sdk == 'media-blocks'
      run: |
        dotnet build "${{ env.Solution_Name_MB }}" --configuration Release --no-restore -f net10.0-maccatalyst
        # Drop this platform's output before the next build; obj/project.assets.json stays for --no-restore.
        find "Media Blocks SDK" -type d \( -name bin -o -path '*/obj/Release' \) -prune -exec rm -rf {} +
        df -h /

    - name: Build Media Blocks (iOS)
      if: matrix.sdk == 'media-blocks'
      run: |
        dotnet build "${{ env.Solution_Filter_MB_iOS }}" --configuration Release --no-restore -f net10.0-ios /p:_RequireCodeSigning=false /p:CodesignKey="-"
        # Drop this platform's output before the next build; obj/project.assets.json stays for --no-restore.
        find "Media Blocks SDK" -type d \( -name bin -o -path '*/obj/Release' \) -prune -exec rm -rf {} +
        df -h /

    - name: Build Media Blocks (Android)
      if: runner.os == 'Windows' || matrix.sdk == 'media-blocks'
      run: dotnet build "${{ env.Solution_Name_MB }}" --configuration Release --no-restore -f net10.0-android

    # Media Player SDK X
    - name: Restore (Media Player)
      if: runner.os == 'Windows' || matrix.sdk == 'media-player'
      run: dotnet restore "${{ env.Solution_Name_MP }}"

    - name: Build Media Player (Windows)
      if: runner.os == 'Windows'
      run: dotnet build "${{ env.Solution_Name_MP }}" --configuration Release --no-restore -f net10.0-windows10.0.19041.0

    - name: Build Media Player (macCatalyst)
      if: matrix.sdk == 'media-player'
      run: |
        dotnet build "${{ env.Solution_Name_MP }}" --configuration Release --no-restore -f net10.0-maccatalyst
        # Drop this platform's output before the next build; obj/project.assets.json stays for --no-restore.
        find "Media Player SDK X" -type d \( -name bin -o -path '*/obj/Release' \) -prune -exec rm -rf {} +
        df -h /

    - name: Build Media Player (iOS)
      if: matrix.sdk == 'media-player'
      run: |
        dotnet build "${{ env.Solution_Name_MP }}" --configuration Release --no-restore -f net10.0-ios /p:_RequireCodeSigning=false /p:CodesignKey="-"
        # Drop this platform's output before the next build; obj/project.assets.json stays for --no-restore.
        find "Media Player SDK X" -type d \( -name bin -o -path '*/obj/Release' \) -prune -exec rm -rf {} +
        df -h /

    - name: Build Media Player (Android)
      if: runner.os == 'Windows' || matrix.sdk == 'media-player'
      run: dotnet build "${{ env.Solution_Name_MP }}" --configuration Release --no-restore -f net10.0-android

    # Video Capture SDK X
    - name: Restore (Video Capture)
      if: runner.os == 'Windows' || matrix.sdk == 'video-capture'
      run: dotnet restore "${{ env.Solution_Name_VC }}"

    - name: Build Video Capture (Windows)
      if: runner.os == 'Windows'
      run: dotnet build "${{ env.Solution_Name_VC }}" --configuration Release --no-restore -f net10.0-windows10.0.19041.0

    - name: Build Video Capture (macCatalyst)
      if: matrix.sdk == 'video-capture'
      run: |
        dotnet build "${{ env.Solution_Name_VC }}" --configuration Release --no-restore -f net10.0-maccatalyst
        # Drop this platform's output before the next build; obj/project.assets.json stays for --no-restore.
        find "Video Capture SDK X" -type d \( -name bin -o -path '*/obj/Release' \) -prune -exec rm -rf {} +
        df -h /

    - name: Build Video Capture (iOS)
      if: matrix.sdk == 'video-capture'
      run: |
        dotnet build "${{ env.Solution_Filter_VC_iOS }}" --configuration Release --no-restore -f net10.0-ios /p:_RequireCodeSigning=false /p:CodesignKey="-"
        # Drop this platform's output before the next build; obj/project.assets.json stays for --no-restore.
        find "Video Capture SDK X" -type d \( -name bin -o -path '*/obj/Release' \) -prune -exec rm -rf {} +
        df -h /

    - name: Build Video Capture (Android)
      if: runner.os == 'Windows' || matrix.sdk == 'video-capture'
      run: dotnet build "${{ env.Solution_Name_VC }}" --configuration Release --no-restore -f net10.0-android

    # Video Edit SDK X
    - name: Restore (Video Edit)
      if: runner.os == 'Windows' || matrix.sdk == 'video-edit'
      run: dotnet restore "Video Edit SDK X/VisioForge.VideoEdit.X.Demos.MAUI.sln"

    - name: Build Video Edit (Windows)
      if: runner.os == 'Windows'
      run: dotnet build "Video Edit SDK X/VisioForge.VideoEdit.X.Demos.MAUI.sln" --configuration Release --no-restore -f net10.0-windows10.0.19041.0

    - name: Build Video Edit (macCatalyst)
      if: matrix.sdk == 'video-edit'
      run: |
        dotnet build "Video Edit SDK X/VisioForge.VideoEdit.X.Demos.MAUI.sln" --configuration Release --no-restore -f net10.0-maccatalyst
        # Drop this platform's output before the next build; obj/project.assets.json stays for --no-restore.
        find "Video Edit SDK X" -type d \( -name bin -o -path '*/obj/Release' \) -prune -exec rm -rf {} +
        df -h /

    - name: Build Video Edit (iOS)
      if: matrix.sdk == 'video-edit'
      run: |
        dotnet build "Video Edit SDK X/VisioForge.VideoEdit.X.Demos.MAUI.sln" --configuration Release --no-restore -f net10.0-ios /p:_RequireCodeSigning=false /p:CodesignKey="-"
        # Drop this platform's output before the next build; obj/project.assets.json stays for --no-restore.
        find "Video Edit SDK X" -type d \( -name bin -o -path '*/obj/Release' \) -prune -exec rm -rf {} +
        df -h /

    - name: Build Video Edit (Android)
      if: runner.os == 'Windows' || matrix.sdk == 'video-edit'
      run: dotnet build "Video Edit SDK X/VisioForge.VideoEdit.X.Demos.MAUI.sln" --configuration Release --no-restore -f net10.0-android
