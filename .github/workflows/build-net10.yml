name: Build ALL (.Net 10)
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    env:
      Solution_Name_MB1: "Media Blocks SDK/VisioForge.MediaBlocks.Demos.CS net10.sln"

      Solution_Name_MP1: "Media Player SDK/VisioForge.MediaPlayer.Demos.CS (NuGet) net10.sln"
      Solution_Name_MP2: "Media Player SDK X/VisioForge.MediaPlayer.X.Demos.CS.Windows net10.sln"
      Solution_Name_MP_VB: "Media Player SDK/VisioForge.MediaPlayer.Demos.VB (NuGet) net10.sln"

      Solution_Name_VC1: "Video Capture SDK/VisioForge.VideoCapture.Demos.CS (NuGet) net10.sln"
      Solution_Name_VC2: "Video Capture SDK/VisioForge.VideoCapture.Demos.CS.CV (NuGet) net10.sln"
      Solution_Name_VC3: "Video Capture SDK X/VisioForge.VideoCaptureX.Demos.CS net10.sln"
      Solution_Name_VC3_VB: "Video Capture SDK X/VisioForge.VideoCaptureX.Demos.VB net10.sln"
      Solution_Name_VC_VB: "Video Capture SDK/VisioForge.VideoCapture.Demos.VB (NuGet) net10.sln"

      Solution_Name_VE1: "Video Edit SDK/VisioForge.VideoEdit.Demos.CS (NuGet) net10.sln"
      Solution_Name_VE2: "Video Edit SDK X/VisioForge.VideoEdit.X.Demos.WinForms net10.sln"
      Solution_Name_VE3: "Video Edit SDK X/VisioForge.VideoEdit.X.Demos.WPF net10.sln"
      Solution_Name_VE_VB: "Video Edit SDK/VisioForge.VideoEdit.Demos.VB (NuGet) net10.sln"

    strategy:
      fail-fast: false
      matrix:
        sdk: [media-blocks, media-player, video-capture, video-edit, video-fingerprinting]

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      if: runner.environment == 'github-hosted'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Verify environment
      run: dotnet --info

    ## Media Blocks

    - name: Restore dependencies $env:Solution_Name_MB1
      if: matrix.sdk == 'media-blocks'
      run: dotnet restore $env:Solution_Name_MB1

    - name: Build app for release $env:Solution_Name_MB1
      if: matrix.sdk == 'media-blocks'
      run: dotnet build $env:Solution_Name_MB1 --configuration Release --no-restore

    ## Media Player

    - name: Restore dependencies $env:Solution_Name_MP1
      if: matrix.sdk == 'media-player'
      run: dotnet restore $env:Solution_Name_MP1

    - name: Build app for release $env:Solution_Name_MP1
      if: matrix.sdk == 'media-player'
      run: dotnet build $env:Solution_Name_MP1 --configuration Release --no-restore

    - name: Restore dependencies $env:Solution_Name_MP2
      if: matrix.sdk == 'media-player'
      run: dotnet restore $env:Solution_Name_MP2

    - name: Build app for release $env:Solution_Name_MP2
      if: matrix.sdk == 'media-player'
      run: dotnet build $env:Solution_Name_MP2 --configuration Release --no-restore

    - name: Restore dependencies $env:Solution_Name_MP_VB
      if: matrix.sdk == 'media-player'
      run: dotnet restore $env:Solution_Name_MP_VB

    - name: Build app for release $env:Solution_Name_MP_VB
      if: matrix.sdk == 'media-player'
      run: dotnet build $env:Solution_Name_MP_VB --configuration Release --no-restore

    ## Video Capture

    - name: Restore dependencies $env:Solution_Name_VC1
      if: matrix.sdk == 'video-capture'
      run: dotnet restore $env:Solution_Name_VC1

    - name: Build app for release $env:Solution_Name_VC1
      if: matrix.sdk == 'video-capture'
      run: dotnet build $env:Solution_Name_VC1 --configuration Release --no-restore

    - name: Restore dependencies $env:Solution_Name_VC2
      if: matrix.sdk == 'video-capture'
      run: dotnet restore $env:Solution_Name_VC2

    - name: Build app for release $env:Solution_Name_VC2
      if: matrix.sdk == 'video-capture'
      run: dotnet build $env:Solution_Name_VC2 --configuration Release --no-restore

    - name: Restore dependencies $env:Solution_Name_VC3
      if: matrix.sdk == 'video-capture'
      run: dotnet restore $env:Solution_Name_VC3

    - name: Build app for release $env:Solution_Name_VC3
      if: matrix.sdk == 'video-capture'
      run: dotnet build $env:Solution_Name_VC3 --configuration Release --no-restore

    - name: Restore dependencies $env:Solution_Name_VC3_VB
      if: matrix.sdk == 'video-capture'
      run: dotnet restore $env:Solution_Name_VC3_VB

    - name: Build app for release $env:Solution_Name_VC3_VB
      if: matrix.sdk == 'video-capture'
      run: dotnet build $env:Solution_Name_VC3_VB --configuration Release --no-restore

    - name: Restore dependencies $env:Solution_Name_VC_VB
      if: matrix.sdk == 'video-capture'
      run: dotnet restore $env:Solution_Name_VC_VB

    - name: Build app for release $env:Solution_Name_VC_VB
      if: matrix.sdk == 'video-capture'
      run: dotnet build $env:Solution_Name_VC_VB --configuration Release --no-restore

    ## Video Edit

    - name: Restore dependencies $env:Solution_Name_VE1
      if: matrix.sdk == 'video-edit'
      run: dotnet restore $env:Solution_Name_VE1

    - name: Build app for release $env:Solution_Name_VE1
      if: matrix.sdk == 'video-edit'
      run: dotnet build $env:Solution_Name_VE1 --configuration Release --no-restore

    - name: Restore dependencies $env:Solution_Name_VE2
      if: matrix.sdk == 'video-edit'
      run: dotnet restore $env:Solution_Name_VE2

    - name: Build app for release $env:Solution_Name_VE2
      if: matrix.sdk == 'video-edit'
      run: dotnet build $env:Solution_Name_VE2 --configuration Release --no-restore

    - name: Restore dependencies $env:Solution_Name_VE3
      if: matrix.sdk == 'video-edit'
      run: dotnet restore $env:Solution_Name_VE3

    - name: Build app for release $env:Solution_Name_VE3
      if: matrix.sdk == 'video-edit'
      run: dotnet build $env:Solution_Name_VE3 --configuration Release --no-restore

    - name: Restore dependencies $env:Solution_Name_VE_VB
      if: matrix.sdk == 'video-edit'
      run: dotnet restore $env:Solution_Name_VE_VB

    - name: Build app for release $env:Solution_Name_VE_VB
      if: matrix.sdk == 'video-edit'
      run: dotnet build $env:Solution_Name_VE_VB --configuration Release --no-restore

    ## Media Blocks Blazor

    - name: Restore (Media Blocks Blazor)
      if: matrix.sdk == 'media-blocks'
      run: dotnet restore "Media Blocks SDK/VisioForge.MediaBlocks.Demos.CS Blazor.sln"
    - name: Build (Media Blocks Blazor)
      if: matrix.sdk == 'media-blocks'
      run: dotnet build "Media Blocks SDK/VisioForge.MediaBlocks.Demos.CS Blazor.sln" --configuration Release --no-restore
    - name: Clean (Media Blocks Blazor)
      if: matrix.sdk == 'media-blocks'
      run: dotnet clean "Media Blocks SDK/VisioForge.MediaBlocks.Demos.CS Blazor.sln" --configuration Release

    ## Video Fingerprinting

    # Apple heads pick their RuntimeIdentifier per configuration, so restore runs inside the Release build.
    # The solution carries net9.0-macos projects, so this leg needs the macos workload on a hosted runner.
    - name: Install workloads (Video Fingerprinting)
      if: matrix.sdk == 'video-fingerprinting' && runner.environment == 'github-hosted'
      run: dotnet workload install macos maui maui-windows maui-android maui-desktop maui-mobile android ios maccatalyst
    - name: Build (Video Fingerprinting)
      if: matrix.sdk == 'video-fingerprinting'
      run: dotnet build "Video Fingerprinting SDK/VideoFingerprinting.sln" --configuration Release
    - name: Clean (Video Fingerprinting)
      if: matrix.sdk == 'video-fingerprinting'
      run: dotnet clean "Video Fingerprinting SDK/VideoFingerprinting.sln" --configuration Release
