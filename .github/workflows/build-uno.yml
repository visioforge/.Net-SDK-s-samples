name: Build Uno Platform
on:
  workflow_dispatch:

# The self-hosted Mac runs a newer Xcode than its .NET Apple workload names; the SDK repo builds the same way.
env:
  ValidateXcodeVersion: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          # One runner per solution: the same single-macOS-runner shape that
          # exhausted the Avalonia leg part-way through its second solution.
          - os: xcode-27
            sdk: media-blocks
          - os: xcode-27
            sdk: media-player
          - os: xcode-27
            sdk: video-capture
    name: build (${{ matrix.os }}${{ matrix.sdk && format(' / {0}', matrix.sdk) || '' }})
    runs-on: ${{ matrix.os }}

    env:
      Solution_Name_MB: "Media Blocks SDK/VisioForge.MediaBlocks.Demos.CS Uno.sln"
      Solution_Name_MP: "Media Player SDK X/VisioForge.MediaPlayer.X.Demos.CS.Uno.sln"
      Solution_Name_VC: "Video Capture SDK X/VisioForge.VideoCaptureX.Demos.CS Uno.sln"

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (image default)
        if: runner.environment == 'github-hosted' && runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Setup .NET
        if: runner.environment == 'github-hosted' && runner.os != 'macOS'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x

      - name: Setup .NET (macOS ARM64)
        if: runner.environment == 'github-hosted' && runner.os == 'macOS'
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --channel 8.0 --architecture arm64
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --channel 9.0 --architecture arm64
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --version 10.0.203 --architecture arm64
          echo "$HOME/.dotnet" >> $GITHUB_PATH
          echo "DOTNET_ROOT=$HOME/.dotnet" >> $GITHUB_ENV

      - name: Install workloads (Windows)
        if: runner.environment == 'github-hosted' && runner.os == 'Windows'
        run: dotnet workload install android ios macos

      # Pinned .NET 10 workload set. ValidateXcodeVersion is off (repo root env), so it builds under
# the xcode-27 image's newer Xcode instead of refusing the mismatch.
      - name: Install workloads (macOS)
        if: runner.environment == 'github-hosted' && runner.os == 'macOS'
        run: dotnet workload install android ios macos maccatalyst --version 10.0.203.1

      # Media Blocks (Windows)
      - name: Restore (Media Blocks)
        if: runner.os == 'Windows'
        run: dotnet restore "${{ env.Solution_Name_MB }}"
      - name: Build (Media Blocks)
        if: runner.os == 'Windows'
        run: dotnet build "${{ env.Solution_Name_MB }}" --configuration Release --no-restore /p:BuildInParallel=false --disable-parallel

      - name: Free space and memory (macOS)
        if: runner.os == 'macOS'
        run: |
          df -h /
          vm_stat | head -5
      # Media Blocks (macOS)
      - name: Build (Media Blocks - macOS)
        if: matrix.sdk == 'media-blocks'
        run: dotnet build "${{ env.Solution_Name_MB }}" --configuration Release /p:BuildInParallel=false --disable-parallel

      # Media Player (Windows)
      - name: Restore (Media Player)
        if: runner.os == 'Windows'
        run: dotnet restore "${{ env.Solution_Name_MP }}"
      - name: Build (Media Player)
        if: runner.os == 'Windows'
        run: dotnet build "${{ env.Solution_Name_MP }}" --configuration Release --no-restore /p:BuildInParallel=false --disable-parallel

      # Media Player (macOS)
      - name: Build (Media Player - macOS)
        if: matrix.sdk == 'media-player'
        run: dotnet build "${{ env.Solution_Name_MP }}" --configuration Release /p:BuildInParallel=false --disable-parallel

      # Video Capture (Windows)
      - name: Restore (Video Capture)
        if: runner.os == 'Windows'
        run: dotnet restore "${{ env.Solution_Name_VC }}"
      - name: Build (Video Capture)
        if: runner.os == 'Windows'
        run: dotnet build "${{ env.Solution_Name_VC }}" --configuration Release --no-restore /p:BuildInParallel=false --disable-parallel

      # Video Capture (macOS)
      - name: Build (Video Capture - macOS)
        if: matrix.sdk == 'video-capture'
        run: dotnet build "${{ env.Solution_Name_VC }}" --configuration Release /p:BuildInParallel=false --disable-parallel
